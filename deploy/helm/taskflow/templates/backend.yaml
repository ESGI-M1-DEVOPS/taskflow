{{- $name := printf "%s-backend" (include "taskflow.fullname" .) -}}
{{- $sel := dict "ctx" . "component" "backend" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "taskflow.selector" $sel | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.rollingUpdate.maxUnavailable }}
  template:
    metadata:
      labels:
        {{- include "taskflow.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      {{- include "taskflow.imagePullSecrets" . | nindent 6 }}
      terminationGracePeriodSeconds: 30
      # Répartit les replicas sur les 2 nœuds : un nœud peut être drainé sans coupure.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "taskflow.selector" $sel | nindent 14 }}
      containers:
        - name: backend
          image: {{ include "taskflow.image" (dict "ctx" . "component" "backend") }}
          # "latest" désigne une image qui change : toujours la retélécharger (jamais une vieille copie en cache).
          imagePullPolicy: {{ eq (toString .Values.image.tag) "latest" | ternary "Always" .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          env:
            - name: PORT
              value: {{ .Values.backend.port | quote }}
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.backend.logLevel | quote }}
            - name: DEBUG_ENDPOINTS
              value: {{ .Values.backend.debugEndpoints | quote }}
            - name: SHUTDOWN_DELAY_MS
              value: {{ .Values.backend.shutdownDelayMs | quote }}
            - name: PGHOST
              value: {{ printf "%s-db" (include "taskflow.fullname" .) }}
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: {{ .Values.db.name | quote }}
            - name: PGUSER
              value: {{ .Values.db.user | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "taskflow.dbSecretName" . }}
                  key: password
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            # Laisse le temps aux endpoints du Service d'être mis à jour avant SIGTERM.
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector:
    {{- include "taskflow.selector" $sel | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "taskflow.selector" $sel | nindent 6 }}
{{- if .Values.backend.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ .Values.backend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.backend.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.backend.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60   # redescente rapide pour la démo
{{- end }}
