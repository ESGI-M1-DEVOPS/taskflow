{{- /*
Identifiants de lecture de la registry privée (GHCR) au format docker-registry.
Créé seulement si registryAuth.password est renseigné ; référencé par tous les pods
via le helper taskflow.imagePullSecrets.
*/ -}}
{{- $ra := .Values.registryAuth | default dict -}}
{{- if $ra.password }}
{{- $user := required "registryAuth.username est obligatoire avec registryAuth.password" $ra.username }}
{{- $auth := printf "%s:%s" $user $ra.password | b64enc }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskflow.fullname" . }}-registry
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict .Values.image.registry (dict "username" $user "password" $ra.password "auth" $auth)) | toJson | b64enc }}
{{- end }}
