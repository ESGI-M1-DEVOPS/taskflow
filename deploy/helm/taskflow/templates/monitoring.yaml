{{- /*
ServiceMonitor : Prometheus (kube-prometheus-stack) scrape /metrics du backend.
Créé seulement si le CRD existe : la chart reste installable sur une plateforme sans Prometheus Operator.
*/ -}}
{{- if and .Values.monitoring.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "taskflow.fullname" . }}-backend
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "taskflow.selector" (dict "ctx" . "component" "backend") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
---
{{- end }}
{{- if .Values.monitoring.grafanaDashboard.enabled }}
# Dashboard "golden signals" chargé automatiquement par le sidecar Grafana.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskflow.fullname" . }}-dashboard
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
    {{- toYaml .Values.monitoring.grafanaDashboard.labels | nindent 4 }}
data:
  taskflow-golden-signals.json: |-
{{ .Files.Get "files/golden-signals.json" | indent 4 }}
{{- end }}
