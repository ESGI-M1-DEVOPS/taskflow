# Pipeline CI/CD de TaskFlow
#   PR         : lint + tests + build + smoke test
#                + environnement de test de la PR : VM Proxmox créée par Terraform, configurée
#                  par Ansible, images taguées pr-<n>-<sha> (si la variable PREVIEW_ENABLED vaut true).
#                  Détruite à la fermeture de la PR (preview-cleanup.yml).
#   push main  : idem + push des images GHCR + déploiement staging (auto)
#                + déploiement production (après validation manuelle sur l'environnement "production")
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  NODE_VERSION: "24"

jobs:
  lint:
    name: Lint & analyse statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/backend/package-lock.json

      - name: Dépendances backend
        working-directory: app/backend
        run: npm ci

      - name: ESLint
        working-directory: app/backend
        run: npm run lint

      - name: Audit des dépendances (vulnérabilités hautes et critiques)
        working-directory: app/backend
        run: npm audit --omit=dev --audit-level=high

      - name: Hadolint (bonnes pratiques Dockerfile)
        run: |
          for f in app/*/Dockerfile; do
            echo "::group::$f"
            docker run --rm -i hadolint/hadolint:v2.12.0 < "$f"
            echo "::endgroup::"
          done

      - name: Helm lint
        run: helm lint deploy/helm/taskflow --set image.owner=ci --set db.password=ci

      - name: Validation docker compose
        working-directory: deploy/compose
        env:
          IMAGE_OWNER: ci
          DB_PASSWORD: ci
        run: docker compose -f compose.yaml config --quiet

      - name: Vérification de syntaxe Ansible
        working-directory: infra/ansible
        run: |
          pipx install ansible-core
          ansible-galaxy collection install -r requirements.yml
          ansible-playbook --syntax-check playbooks/site.yml playbooks/github-runner.yml playbooks/preview.yml

      - name: Terraform (format et validation)
        working-directory: infra/terraform/preview
        run: |
          docker run --rm -v "$PWD:/work" -w /work --entrypoint sh hashicorp/terraform:1.17.2 -c \
            'terraform fmt -check -diff && terraform init -backend=false -input=false > /dev/null && terraform validate'

  test:
    name: Tests automatisés
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/backend/package-lock.json

      - name: Dépendances backend
        working-directory: app/backend
        run: npm ci

      - name: Tests unitaires et d'API
        working-directory: app/backend
        run: npm test

  build:
    name: Build, smoke test & publication des images
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.vars.outputs.owner }}
      tag: ${{ steps.vars.outputs.tag }}
      db_tag: ${{ steps.vars.outputs.db_tag }}
    env:
      SMOKE_DB_PASSWORD: smoke-test
      # Images publiées : celles de main, et celles d'une PR du dépôt (jamais d'un fork)
      # quand l'environnement de test des PR est activé.
      PUBLISH: >-
        ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') ||
            (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name == github.repository &&
             vars.PREVIEW_ENABLED == 'true') }}
    steps:
      - uses: actions/checkout@v4

      - name: Calcul des tags
        id: vars
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            # PR : tag dédié, base comprise, pour ne jamais écraser une image de main ni "latest"
            tag="pr-${PR_NUMBER}-${PR_HEAD_SHA::7}"
            db_tag="$tag"
          else
            tag="${GITHUB_SHA::7}"
            db_tag="$(tr -d '[:space:]' < app/db/VERSION)"
          fi
          {
            echo "owner=${GITHUB_REPOSITORY_OWNER,,}"
            echo "tag=$tag"
            echo "db_tag=$db_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Build des images (tag = SHA du commit)
        env:
          PREFIX: ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/taskflow
          TAG: ${{ steps.vars.outputs.tag }}
          DB_TAG: ${{ steps.vars.outputs.db_tag }}
        run: |
          docker build --build-arg APP_VERSION="$TAG" -t "$PREFIX-backend:$TAG" -t "$PREFIX-backend:latest" app/backend
          docker build --build-arg APP_VERSION="$TAG" -t "$PREFIX-frontend:$TAG" -t "$PREFIX-frontend:latest" app/frontend
          docker build -t "$PREFIX-db:$DB_TAG" -t "$PREFIX-db:latest" app/db

      - name: Smoke test de la stack complète (docker compose)
        working-directory: deploy/compose
        env:
          IMAGE_OWNER: ${{ steps.vars.outputs.owner }}
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
          DB_IMAGE_TAG: ${{ steps.vars.outputs.db_tag }}
          DB_PASSWORD: ${{ env.SMOKE_DB_PASSWORD }}
        run: |
          docker compose -f compose.yaml up -d --wait --wait-timeout 120
          curl -fsS http://localhost:8080/api/version | tee /dev/stderr | grep -q "\"$IMAGE_TAG\""
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"title":"smoke test"}' http://localhost:8080/api/tasks
          curl -fsS http://localhost:8080/api/tasks | grep -q "smoke test"
          curl -fsS http://localhost:8080/ | grep -q "TaskFlow"

      - name: Logs de la stack en cas d'échec
        if: failure()
        working-directory: deploy/compose
        env:
          IMAGE_OWNER: ${{ steps.vars.outputs.owner }}
          DB_PASSWORD: ${{ env.SMOKE_DB_PASSWORD }}
        run: docker compose -f compose.yaml logs

      - name: Connexion à GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication des images
        if: env.PUBLISH == 'true'
        env:
          PREFIX: ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/taskflow
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          for component in backend frontend db; do
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              docker push "$PREFIX-$component:$TAG"       # PR : uniquement pr-<n>-<sha>
            else
              docker push --all-tags "$PREFIX-$component" # main : SHA + latest (+ version de la base)
            fi
          done

  preview:
    name: Environnement de test de la PR
    needs: build
    # Jamais pour un fork : il exécuterait du code inconnu sur le runner du Proxmox.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.PREVIEW_ENABLED == 'true'
    runs-on: [self-hosted, proxmox]
    permissions:
      contents: read
      pull-requests: write # commentaire avec le lien de l'environnement
    # Un seul Terraform à la fois par PR (la destruction attend la fin d'une création en cours).
    concurrency:
      group: preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    environment:
      name: preview
      url: ${{ steps.vm.outputs.url }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Préparer la clé SSH et les secrets Ansible
        env:
          SSH_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/ansible_key"
          # Nettoie les défauts de copier-coller (BOM UTF-8, CR Windows, espaces en bord de ligne, lignes vides)
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed -e '1s/^\xEF\xBB\xBF//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' > "$RUNNER_TEMP/ansible_key"
          if ! ssh-keygen -y -f "$RUNNER_TEMP/ansible_key" > "$RUNNER_TEMP/ansible_key.pub" 2>/dev/null; then
            echo "::error::Le secret ANSIBLE_SSH_PRIVATE_KEY n'est pas une clé privée SSH valide. Recopier la sortie complète de 'cat ~/.ssh/ansible' (lignes BEGIN et END comprises)."
            exit 1
          fi
          # Grafana n'est pas déployé sur l'environnement de PR : mot de passe inutilisé, mais attendu par le .env.
          jq -n --arg db "$DB_PASSWORD" --arg reg "$REGISTRY_TOKEN" --arg gf "$(openssl rand -hex 16)" \
            '{db_password: $db, registry_password: $reg, grafana_admin_password: $gf}' > "$RUNNER_TEMP/secrets.json"
          chmod 600 "$RUNNER_TEMP/secrets.json"

      - name: Terraform - créer ou mettre à jour la VM de la PR
        id: vm
        env:
          TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
        run: |
          # Sans pipefail (absent du shell par défaut de GitHub), l'échec de Terraform serait masqué par tee.
          set -o pipefail
          TF_VAR_ssh_public_key="$(cat "$RUNNER_TEMP/ansible_key.pub")"
          export TF_VAR_ssh_public_key
          # En cas d'échec, l'erreur Terraform est remontée en annotation : visible dans l'onglet Checks de la PR.
          if ! bash infra/terraform/preview/tf.sh "$PR_NUMBER" apply -auto-approve -no-color 2>&1 | tee "$RUNNER_TEMP/terraform.log"; then
            summary=$(grep -A8 'Error:' "$RUNNER_TEMP/terraform.log" | sed 's/^[│ ]*//' | grep -v '^$' | tr '\n' ' ' | cut -c1-700)
            echo "::error title=Terraform apply::${summary:-voir le log de cette étape}"
            exit 1
          fi
          ip=$(bash infra/terraform/preview/tf.sh "$PR_NUMBER" output -raw ip)
          vm=$(bash infra/terraform/preview/tf.sh "$PR_NUMBER" output -raw vm_name)
          {
            echo "ip=$ip"
            echo "vm=$vm"
            echo "url=http://$ip:8080"
          } >> "$GITHUB_OUTPUT"

      - name: Collections Ansible
        working-directory: infra/ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Ansible - Docker et application sur la VM de la PR
        working-directory: infra/ansible
        run: >-
          ansible-playbook playbooks/preview.yml
          --private-key "$RUNNER_TEMP/ansible_key"
          -e @"$RUNNER_TEMP/secrets.json"
          -e pr_number="$PR_NUMBER"
          -e preview_ip=${{ steps.vm.outputs.ip }}
          -e image_owner=${{ needs.build.outputs.owner }}
          -e image_tag="$TAG"
          -e db_image_tag=${{ needs.build.outputs.db_tag }}

      - name: Tests de l'environnement de la PR
        env:
          URL: ${{ steps.vm.outputs.url }}
        run: |
          curl -fsS "$URL/api/version" | tee /dev/stderr | grep -q "\"$TAG\""
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"title":"test environnement PR"}' "$URL/api/tasks" > /dev/null
          curl -fsS "$URL/api/tasks" | grep -q "test environnement PR"
          curl -fsS "$URL/" | grep -q "TaskFlow"
          echo "Environnement de la PR #$PR_NUMBER opérationnel : $URL (version $TAG)"

      - name: Logs de l'application en cas d'échec
        if: failure() && steps.vm.outputs.ip != ''
        continue-on-error: true # VM injoignable : l'erreur utile est celle de l'étape précédente
        env:
          IP: ${{ steps.vm.outputs.ip }}
        run: >-
          ssh -i "$RUNNER_TEMP/ansible_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
          -o ConnectTimeout=10 "admin@$IP"
          'cd /opt/taskflow/deploy/compose 2>/dev/null && sudo docker compose logs --tail 100 || sudo cloud-init status --long'

      - name: Lien de l'environnement dans la PR
        uses: actions/github-script@v8
        env:
          URL: ${{ steps.vm.outputs.url }}
          VM: ${{ steps.vm.outputs.vm }}
        with:
          script: |
            const marker = '<!-- taskflow-preview -->';
            const body = [
              marker,
              '### Environnement de test de la PR',
              '',
              `Application : ${process.env.URL} (Twingate connecté)`,
              '',
              '| | |',
              '|---|---|',
              `| Version | \`${process.env.TAG}\` |`,
              `| VM Proxmox | \`${process.env.VM}\` (Terraform) |`,
              `| Mis à jour | ${new Date().toLocaleString('fr-FR', { timeZone: 'Europe/Paris' })} |`,
              '',
              'Mis à jour à chaque push sur la PR, détruit automatiquement à sa fermeture.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Nettoyage des secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/ansible_key" "$RUNNER_TEMP/ansible_key.pub" "$RUNNER_TEMP/secrets.json"

  deploy-staging:
    name: Déploiement staging
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, proxmox]
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4

      # Une relance d'un ancien run (ou une approbation tardive) ne doit jamais faire
      # revenir l'environnement à une version antérieure (vécu : run #7 relancé après le run #9).
      # Pour revenir en arrière volontairement : git revert + PR, ou helm rollback.
      - name: Refuser un déploiement obsolète
        run: |
          git fetch --quiet --depth=1 origin main
          HEAD_MAIN=$(git rev-parse FETCH_HEAD)
          if [ "$HEAD_MAIN" != "$GITHUB_SHA" ]; then
            echo "::error::Ce run déploierait ${GITHUB_SHA::7} alors que main est à ${HEAD_MAIN::7} : déploiement d'une version obsolète refusé. Relancer plutôt le run du dernier commit de main."
            exit 1
          fi
          echo "OK : ${GITHUB_SHA::7} est bien le dernier commit de main."

      - name: Préparer la clé SSH et les secrets Ansible
        env:
          SSH_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/ansible_key"
          # Nettoie les défauts de copier-coller (BOM UTF-8, CR Windows, espaces en bord de ligne, lignes vides)
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed -e '1s/^\xEF\xBB\xBF//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' > "$RUNNER_TEMP/ansible_key"
          if ! ssh-keygen -y -f "$RUNNER_TEMP/ansible_key" > "$RUNNER_TEMP/ansible_key.pub" 2>/dev/null; then
            echo "::error::Le secret ANSIBLE_SSH_PRIVATE_KEY n'est pas une clé privée SSH valide. Recopier la sortie complète de 'cat ~/.ssh/ansible' (lignes BEGIN et END comprises)."
            exit 1
          fi
          echo "Clé SSH chargée : $(ssh-keygen -lf "$RUNNER_TEMP/ansible_key.pub")"
          jq -n --arg db "$DB_PASSWORD" --arg gf "$GRAFANA_PASSWORD" --arg reg "$REGISTRY_TOKEN" \
            '{db_password: $db, grafana_admin_password: $gf, registry_password: $reg}' > "$RUNNER_TEMP/secrets.json"
          chmod 600 "$RUNNER_TEMP/secrets.json"

      - name: Collections Ansible
        working-directory: infra/ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Ansible - mise à jour du staging
        working-directory: infra/ansible
        run: >-
          ansible-playbook playbooks/deploy-staging.yml
          --private-key "$RUNNER_TEMP/ansible_key"
          -e @"$RUNNER_TEMP/secrets.json"
          -e image_owner=${{ needs.build.outputs.owner }}
          -e image_tag=${{ needs.build.outputs.tag }}
          -e db_image_tag=${{ needs.build.outputs.db_tag }}

      - name: Nettoyage des secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/ansible_key" "$RUNNER_TEMP/ansible_key.pub" "$RUNNER_TEMP/secrets.json"

  deploy-production:
    name: Déploiement production
    needs: [build, deploy-staging]
    runs-on: [self-hosted, proxmox]
    # Règle de protection "Required reviewers" sur cet environnement => déploiement semi-automatique.
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    steps:
      - uses: actions/checkout@v4

      # Une relance d'un ancien run (ou une approbation tardive) ne doit jamais faire
      # revenir l'environnement à une version antérieure (vécu : run #7 relancé après le run #9).
      # Pour revenir en arrière volontairement : git revert + PR, ou helm rollback.
      - name: Refuser un déploiement obsolète
        run: |
          git fetch --quiet --depth=1 origin main
          HEAD_MAIN=$(git rev-parse FETCH_HEAD)
          if [ "$HEAD_MAIN" != "$GITHUB_SHA" ]; then
            echo "::error::Ce run déploierait ${GITHUB_SHA::7} alors que main est à ${HEAD_MAIN::7} : déploiement d'une version obsolète refusé. Relancer plutôt le run du dernier commit de main."
            exit 1
          fi
          echo "OK : ${GITHUB_SHA::7} est bien le dernier commit de main."

      - name: Préparer la clé SSH et les secrets Ansible
        env:
          SSH_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/ansible_key"
          # Nettoie les défauts de copier-coller (BOM UTF-8, CR Windows, espaces en bord de ligne, lignes vides)
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed -e '1s/^\xEF\xBB\xBF//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' > "$RUNNER_TEMP/ansible_key"
          if ! ssh-keygen -y -f "$RUNNER_TEMP/ansible_key" > "$RUNNER_TEMP/ansible_key.pub" 2>/dev/null; then
            echo "::error::Le secret ANSIBLE_SSH_PRIVATE_KEY n'est pas une clé privée SSH valide. Recopier la sortie complète de 'cat ~/.ssh/ansible' (lignes BEGIN et END comprises)."
            exit 1
          fi
          echo "Clé SSH chargée : $(ssh-keygen -lf "$RUNNER_TEMP/ansible_key.pub")"
          jq -n --arg db "$DB_PASSWORD" --arg reg "$REGISTRY_TOKEN" \
            '{db_password: $db, registry_password: $reg}' > "$RUNNER_TEMP/secrets.json"
          chmod 600 "$RUNNER_TEMP/secrets.json"

      - name: Collections Ansible
        working-directory: infra/ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Ansible - rolling update Helm (rollback auto si échec)
        working-directory: infra/ansible
        run: >-
          ansible-playbook playbooks/deploy-prod.yml
          --private-key "$RUNNER_TEMP/ansible_key"
          -e @"$RUNNER_TEMP/secrets.json"
          -e image_owner=${{ needs.build.outputs.owner }}
          -e image_tag=${{ needs.build.outputs.tag }}
          -e db_image_tag=${{ needs.build.outputs.db_tag }}

      - name: Vérification depuis l'Ingress
        if: vars.PROD_URL != ''
        env:
          PROD_URL: ${{ vars.PROD_URL }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          for _ in $(seq 1 12); do
            if curl -fsS "$PROD_URL/api/version" | grep -q "\"$TAG\""; then
              echo "Production servie en version $TAG"; exit 0
            fi
            sleep 5
          done
          echo "La production ne sert pas la version $TAG"; exit 1

      - name: Nettoyage des secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/ansible_key" "$RUNNER_TEMP/ansible_key.pub" "$RUNNER_TEMP/secrets.json"
