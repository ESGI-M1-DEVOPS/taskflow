[defaults]
inventory = inventories/proxmox/hosts.yml
roles_path = roles
host_key_checking = False
interpreter_python = auto_silent
callback_result_format = yaml
retry_files_enabled = False
# Les rôles lisent les facts via ansible_facts[...] (comportement par défaut d'ansible-core >= 2.24).
inject_facts_as_vars = False

[ssh_connection]
pipelining = True
