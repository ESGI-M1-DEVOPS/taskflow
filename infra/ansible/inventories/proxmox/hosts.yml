# Inventaire des VM Proxmox (Debian 13, OS seul installé), accessibles via Twingate.
# Connexion SSH avec le compte sudoer "admin", par clé (~/.ssh/ansible).
# Premier lancement avec -K (mot de passe sudo) : Ansible configure ensuite sudo sans
# mot de passe pour ce compte, nécessaire aux déploiements lancés par la CI.
all:
  vars:
    ansible_user: admin
  children:
    # Environnement de test/staging : Docker + docker compose, runner GitHub Actions,
    # et poste d'administration Ansible
    staging:
      hosts:
        staging-1:
          ansible_host: 10.1.20.72

    # Production : cluster Kubernetes (k3s) sur 2 nœuds
    k3s_server:
      hosts:
        k8s-1:
          ansible_host: 10.1.20.73
    k3s_agents:
      hosts:
        k8s-2:
          ansible_host: 10.1.20.74
    k3s_cluster:
      children:
        k3s_server:
        k3s_agents:
