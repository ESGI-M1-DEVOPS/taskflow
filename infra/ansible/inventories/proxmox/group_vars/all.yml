# Variables communes. Les secrets (db_password, k3s_token, grafana_admin_password,
# github_runner_token) sont dans secrets.yml (non versionné) : -e @secrets.yml

# --- Images ---
registry: ghcr.io
image_owner: esgi-m1-devops    # organisation GitHub, en minuscules (exigé par GHCR)
image_tag: latest              # surchargé par la CI : -e image_tag=<sha>
db_image_tag: "1.0.0"          # cf. app/db/VERSION

# Images PRIVÉES : lecture avec un jeton GitHub classique "read:packages".
# registry_username = compte GitHub qui a créé le jeton ; le jeton (registry_password)
# est dans secrets.yml et dans le secret GitHub GHCR_READ_TOKEN.
registry_username: Poliaqt

# --- Dépôt GitHub (pour le runner self-hosted) ---
github_repository: ESGI-M1-DEVOPS/taskflow

# --- Chemins ---
repo_root: "{{ playbook_dir }}/../../.."

# --- Application en production ---
app_namespace: taskflow
prod_chart_dir: /opt/taskflow/chart
app_host: ""                   # ex: taskflow.192.168.1.31.nip.io ; vide = toutes les requêtes

# --- k3s ---
k3s_channel: stable
# Versions figées = celles validées sur Proxmox le 23/11/2026 (reconstruction reproductible).
# Pour monter de version : changer ici, tester, puis PR.
k3s_version: "v1.37.2+k3s1"    # vide = dernière version du canal k3s_channel
k3s_kubeconfig: /etc/rancher/k3s/k3s.yaml
k3s_server_ip: "{{ hostvars[groups['k3s_server'][0]].ansible_host }}"

# --- Monitoring (production) ---
monitoring_namespace: monitoring
grafana_nodeport: 30300
prometheus_nodeport: 30090
loki_enabled: true
kps_chart_version: "93.9.0"    # kube-prometheus-stack (Prometheus 3.16, Grafana 13.3, Alertmanager 0.35)
loki_chart_version: "7.7.0"    # Loki 3.6
alloy_chart_version: "1.16.0"  # Grafana Alloy 1.22

# --- Staging ---
staging_dir: /opt/taskflow
staging_http_port: 8080
staging_monitoring: true
