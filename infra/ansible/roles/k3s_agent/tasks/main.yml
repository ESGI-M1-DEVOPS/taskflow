- name: Télécharger le script d'installation k3s
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"

- name: Installer k3s (worker) et rejoindre le cluster
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_URL: "https://{{ k3s_server_ip }}:6443"
    K3S_TOKEN: "{{ k3s_token }}"
    INSTALL_K3S_EXEC: "agent --node-ip {{ ansible_host }}"

- name: Vérifier que le worker a rejoint le cluster
  ansible.builtin.command: k3s kubectl get node {{ ansible_facts['hostname'] }} --no-headers
  delegate_to: "{{ groups['k3s_server'][0] }}"
  register: agent_node
  until: "' Ready' in agent_node.stdout"
  retries: 30
  delay: 10
  changed_when: false

# k3s n'étiquette que le control-plane : sans ce label, `kubectl get nodes` affiche
# <none> dans la colonne ROLES du worker. Le label est purement informatif (le scheduler
# ne l'utilise pas). Le kubelet n'a pas le droit de poser lui-même un label
# node-role.kubernetes.io/* (option --node-label refusée), d'où la pose depuis le serveur.
- name: Afficher le rôle worker dans kubectl get nodes
  ansible.builtin.command: >-
    k3s kubectl label node {{ ansible_facts['hostname'] }}
    node-role.kubernetes.io/worker=true --overwrite
  delegate_to: "{{ groups['k3s_server'][0] }}"
  register: worker_label
  changed_when: "'not labeled' not in worker_label.stdout"
