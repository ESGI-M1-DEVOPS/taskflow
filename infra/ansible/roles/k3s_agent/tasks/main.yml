- name: Télécharger le script d'installation k3s
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"

- name: Installer k3s (worker) et rejoindre le cluster
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_URL: "https://{{ k3s_server_ip }}:6443"
    K3S_TOKEN: "{{ k3s_token }}"
    INSTALL_K3S_EXEC: "agent --node-ip {{ ansible_host }}"

- name: Vérifier que le worker a rejoint le cluster
  ansible.builtin.command: k3s kubectl get node {{ ansible_facts['hostname'] }} --no-headers
  delegate_to: "{{ groups['k3s_server'][0] }}"
  register: agent_node
  until: "' Ready' in agent_node.stdout"
  retries: 30
  delay: 10
  changed_when: false
