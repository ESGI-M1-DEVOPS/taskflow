- name: Télécharger le script d'installation Helm 3
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /usr/local/bin/get-helm-3.sh
    mode: "0755"

- name: Installer Helm
  ansible.builtin.command: /usr/local/bin/get-helm-3.sh
  args:
    creates: /usr/local/bin/helm
