# Version à déployer : celle passée explicitement (-e image_tag=<sha>, toujours le cas en CI),
# sinon celle DÉJÀ en production. Relancer site.yml ne change donc jamais la version servie
# (vécu : une relance de site.yml avait redéployé une ancienne image "latest" restée en cache).
- name: Lire la version actuellement déployée
  ansible.builtin.command: >-
    helm get values taskflow --namespace {{ app_namespace }}
    --kubeconfig {{ k3s_kubeconfig }} --output json
  register: current_release
  changed_when: false
  failed_when: false
  when: image_tag | default('') | length == 0

- name: Choisir la version à déployer
  ansible.builtin.set_fact:
    deploy_tag: "{{ image_tag if (image_tag | default('') | length > 0) else (current_values.image.tag | default('latest')) }}"
  vars:
    current_values: "{{ ((current_release.stdout | default('', true)) or '{}') | from_json | default({}, true) }}"

- name: Version qui va être déployée
  ansible.builtin.debug:
    msg: "image_tag={{ deploy_tag }} ({{ 'demandée' if (image_tag | default('') | length > 0) else 'conservée : version déjà déployée' }})"

- name: Supprimer l'ancienne copie de la chart
  ansible.builtin.file:
    path: "{{ prod_chart_dir }}"
    state: absent
  changed_when: false

- name: Copier la chart Helm TaskFlow sur le serveur
  ansible.builtin.copy:
    src: "{{ repo_root }}/deploy/helm/taskflow/"
    dest: "{{ prod_chart_dir }}/"
    mode: "0644"
    directory_mode: "0755"
  changed_when: false

# Rolling update (maxSurge 1 / maxUnavailable 0) piloté par Kubernetes.
# atomic : si les nouveaux pods ne deviennent pas "Ready", Helm revient automatiquement
# à la version précédente => la prod reste servie par l'ancienne version.
- name: Déployer / mettre à jour TaskFlow
  kubernetes.core.helm:
    name: taskflow
    chart_ref: "{{ prod_chart_dir }}"
    release_namespace: "{{ app_namespace }}"
    create_namespace: true
    kubeconfig: "{{ k3s_kubeconfig }}"
    atomic: true
    wait: true
    # Délai avant rollback automatique si les pods ne deviennent pas prêts (réduit en démo : -e helm_wait_timeout=90s)
    wait_timeout: "{{ helm_wait_timeout | default('5m0s') }}"
    values:
      image:
        registry: "{{ registry }}"
        owner: "{{ image_owner }}"
        tag: "{{ deploy_tag }}"
      # Images privées : la chart crée le secret docker-registry si le jeton est fourni.
      registryAuth:
        username: "{{ registry_username | default('') }}"
        password: "{{ registry_password | default('') }}"
      db:
        imageTag: "{{ db_image_tag }}"
        password: "{{ db_password }}"
      ingress:
        host: "{{ app_host }}"

# Smoke test post-déploiement sur le chemin complet frontend -> backend -> BDD.
# Les sondes ne couvrent pas ce chemin (un frontend est "prêt" même si le backend est injoignable) :
# en cas d'échec, on revient à la release précédente.
- name: Smoke test et rollback si échec
  block:
    - name: Smoke test via le frontend (API + BDD)
      ansible.builtin.command: >-
        k3s kubectl -n {{ app_namespace }} exec deploy/taskflow-frontend --
        wget -qO- http://127.0.0.1:8080/api/version
      register: prod_version
      until: prod_version.rc == 0
      retries: 6
      delay: 5
      changed_when: false

    - name: Version en production
      ansible.builtin.debug:
        msg: "{{ prod_version.stdout | from_json }}"
  rescue:
    - name: Rollback vers la release précédente
      ansible.builtin.command: helm rollback taskflow --namespace {{ app_namespace }} --wait --kubeconfig {{ k3s_kubeconfig }}
      changed_when: true

    - name: Échec du déploiement
      ansible.builtin.fail:
        msg: "Smoke test KO après déploiement de {{ deploy_tag }} : rollback effectué, la version précédente est servie."
