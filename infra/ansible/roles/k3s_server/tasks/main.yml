- name: Télécharger le script d'installation k3s
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"

# k3s embarque : containerd, Traefik (Ingress), metrics-server (requis par le HPA),
# CoreDNS et le provisionneur de volumes local-path.
- name: Installer k3s (control-plane)
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_TOKEN: "{{ k3s_token }}"
    INSTALL_K3S_EXEC: >-
      server
      --write-kubeconfig-mode 644
      --node-ip {{ ansible_host }}
      --tls-san {{ ansible_host }}

- name: Attendre que le nœud soit Ready
  ansible.builtin.command: k3s kubectl get nodes --no-headers
  register: k3s_nodes
  until: "' Ready' in k3s_nodes.stdout"
  retries: 30
  delay: 10
  changed_when: false

- name: Récupérer le kubeconfig sur le poste d'administration
  ansible.builtin.fetch:
    src: "{{ k3s_kubeconfig }}"
    dest: "{{ repo_root }}/infra/ansible/kubeconfig-prod.yaml"
    flat: true

- name: Faire pointer le kubeconfig vers l'IP du serveur
  ansible.builtin.replace:
    path: "{{ repo_root }}/infra/ansible/kubeconfig-prod.yaml"
    regexp: 'https://127\.0\.0\.1:6443'
    replace: "https://{{ ansible_host }}:6443"
  delegate_to: localhost
  become: false
