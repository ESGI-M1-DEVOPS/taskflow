- name: Ajouter le dépôt APT officiel Docker
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [stable]
    architectures: ["{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"]
    signed_by: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"

- name: Installer Docker Engine et le plugin compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Dossier de surcharge systemd Docker
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"

# Docker >= 29 refuse les clients API < 1.44 ; certains outils (cAdvisor) sont plus anciens.
- name: Accepter les clients Docker plus anciens
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/min-api-version.conf
    content: |
      [Service]
      Environment=DOCKER_MIN_API_VERSION=1.24
    mode: "0644"
  notify: Redémarrer Docker

- name: Démarrer Docker au boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Ajouter l'utilisateur SSH au groupe docker
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  when: ansible_user != 'root'
